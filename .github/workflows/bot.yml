name: Run Sirzipp Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For ddddocr)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp-socks ddddocr python-telegram-bot requests

      - name: Run Sirzipp Bot Script
        run: |
          # အင်တာနက်က proxy တွေ လိုက်မဆွဲတော့ပါ
          # သင့် repository ထဲမှာရှိတဲ့ (သို့မဟုတ် Bot ကနေ သိမ်းလိုက်တဲ့) proxies.txt ထဲကဟာကိုပဲ တိုက်ရိုက်သုံးပါမယ်
          timeout 300m python sirzippfix.py
