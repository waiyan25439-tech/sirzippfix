name: Run Sirzipp Bot & Auto Proxies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot-and-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-Create & Update Proxies File
        run: |
          curl -s "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=10000&country=all&ssl=all&anonymity=all" > proxies.txt

      - name: Install System Dependencies (For ddddocr)
        run: |
          sudo apt-get update
          # libgl1-mesa-glx အစား libgl1 ကို သုံးပေးရန်
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp-socks ddddocr python-telegram-bot requests

      - name: Run Sirzipp Bot Script
        run: |
          timeout 300m python sirzippfix.py
